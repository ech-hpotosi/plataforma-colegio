spring:
  application:
    name: plataforma-colegio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plataforma}
    username: ${DB_USUARIO:plataforma}
    password: ${DB_CONTRASENA:plataforma}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades coincidan
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

plataforma:
  admin-inicial:
    usuario: ${ADMIN_USUARIO:admin}
    contrasena: ${ADMIN_CONTRASENA:}
  # Reglas del SIEE para asistencia. Pasaran a la configuracion del SIEE cuando exista ese modulo.
  asistencia:
    porcentaje-maximo-inasistencia: 15
    dias-habiles-justificacion: 3
    semanas-lectivas: 40
