name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Las pruebas usan Testcontainers; el runner de GitHub ya trae Docker
      - name: Compilar y probar
        run: ./mvnw -B verify
      # Si falla, deja el resumen de cada prueba fallida como anotacion del job
      - name: Resumen de pruebas fallidas
        if: failure()
        run: |
          grep -l -E '<(failure|error)' target/surefire-reports/*.xml target/failsafe-reports/*.xml 2>/dev/null | while read -r f; do
            msg=$(grep -A6 -E '<(failure|error)' "$f" | head -c 3000 | tr '\n' ' ')
            echo "::error title=$(basename "$f")::$msg"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
